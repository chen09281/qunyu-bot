services:
  qq-bot:
    build: .
    restart: unless-stopped
    ports:
      - "${BOT_BIND:-127.0.0.1}:${BOT_PORT:-3080}:3080"
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      DATA_DIR: /app/data
      RUNTIME_MODE: docker
      LINK_PYTHON: /opt/link-parser/bin/python
      NAPCAT_MEDIA_DIR: ${NAPCAT_MEDIA_DIR:-/app/qqbot-media}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - bot-data:/app/data
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
volumes:
  bot-data:
